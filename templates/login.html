{% extends "base.html" %}
{% block title %}Login - Invenex{% endblock %}
{% block content %}
<style>
  body:not(:has(.topbar)) {
    background: linear-gradient(135deg, #2a78d6, #184f95);
    min-height: 100vh;
  }
</style>
<div class="row justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="col-md-4">
    <div class="card p-4">
      <div class="text-center mb-3">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white mb-2" style="width:56px;height:56px;">
          <i class="bi bi-boxes fs-3"></i>
        </div>
        <h3 class="mb-0">Invenex</h3>
        <p class="text-muted small">Inventory &middot; Income &middot; Expense</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
